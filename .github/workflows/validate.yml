name: Validate

# Execução manual: Actions > Validate > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:js
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: production-assets
          path: public/build
          retention-days: 7

  php:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            database: sqlite
          - php: '8.3'
            database: sqlite
          - php: '8.3'
            database: mysql
    services:
      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_DATABASE: portfolio_ci_test
          MYSQL_USER: portfolio_test
          MYSQL_PASSWORD: portfolio_test_password
          MYSQL_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, pdo_sqlite, pdo_mysql, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - uses: actions/download-artifact@v4
        with:
          name: production-assets
          path: public/build
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php vendor/bin/phpunit --configuration phpunit.xml
        if: matrix.database == 'sqlite'
      - run: php vendor/bin/phpunit --configuration phpunit.mysql.xml
        if: matrix.database == 'mysql'

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: php vendor/bin/pint --test
      - run: git diff --check
